<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Compass — Demo Access</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,66,245,0.18) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, rgba(59,130,246,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      position: relative;
      backdrop-filter: blur(12px);
    }

    .logo { display: block; height: 28px; width: auto; margin: 0 auto 32px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99,66,245,0.15);
      border: 1px solid rgba(99,66,245,0.3);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(180,160,255,0.9);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #7c5cfa;
      flex-shrink: 0;
    }

    h1 { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 8px; }

    .subtitle { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 32px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; margin-bottom: 16px; }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 44px 13px 16px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
    }

    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus { border-color: rgba(99,66,245,0.6); background: rgba(255,255,255,0.08); }
    input.error { border-color: rgba(239,68,68,0.6); animation: shake 0.35s ease; }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.3); padding: 0; line-height: 1; transition: color 0.2s;
    }
    .toggle-pw:hover { color: rgba(255,255,255,0.6); }

    .error-msg { font-size: 12.5px; color: #f87171; margin-top: -8px; margin-bottom: 16px; display: none; }
    .error-msg.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #6342f5 0%, #4f46e5 100%);
      border: none; border-radius: 10px; padding: 14px;
      font-size: 15px; font-weight: 600; color: #fff;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; font-family: inherit;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"].loading { opacity: 0.7; cursor: not-allowed; pointer-events: none; }

    .footer-note { text-align: center; font-size: 12px; color: rgba(255,255,255,0.2); margin-top: 24px; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-dark.png" alt="Case Compass" class="logo">
    <div class="badge">Protected Demo</div>
    <h1>Enter your access password</h1>
    <p class="subtitle">This demo is restricted to invited guests. Enter the password provided by your Case Compass contact.</p>

    <form id="gateForm" onsubmit="checkPassword(event)">
      <label for="pw">Password</label>
      <div class="input-wrap">
        <input type="password" id="pw" placeholder="Enter password" autocomplete="current-password" autofocus>
        <button type="button" class="toggle-pw" onclick="toggleVisibility()" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <p class="error-msg" id="errMsg">Incorrect password. Please try again.</p>
      <button type="submit" id="submitBtn">Access Demo →</button>
    </form>

    <p class="footer-note">Need access? Contact your Case Compass account manager.</p>
  </div>

  <script>
    // SHA-256 of "CaseCompass2026!!"
    const CORRECT = 'c8037675c7e6963bd2457ea61eff4943a1308f5ac67ee8e68e868502e2f867fa';

    if (sessionStorage.getItem('cc_demo_auth') === 'granted') {
      window.location.replace('/demo/app/');
    }

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkPassword(e) {
      e.preventDefault();
      const input = document.getElementById('pw');
      const btn   = document.getElementById('submitBtn');
      const err   = document.getElementById('errMsg');

      btn.classList.add('loading');
      btn.textContent = 'Checking…';
      err.classList.remove('visible');
      input.classList.remove('error');

      const hash = await sha256(input.value.trim());

      if (hash === CORRECT) {
        sessionStorage.setItem('cc_demo_auth', 'granted');
        window.location.replace('/demo/app/');
      } else {
        btn.classList.remove('loading');
        btn.textContent = 'Access Demo →';
        input.classList.add('error');
        err.classList.add('visible');
        input.value = '';
        input.focus();
      }
    }

    function toggleVisibility() {
      const input = document.getElementById('pw');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
